<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- ลายพื้นหลังซูชิน่ารัก (วาดเอง) ต่อกันเป็นแผ่นได้ไม่มีรอยต่อ -->
  <defs>
    <g id="face">
      <circle cx="-5" cy="0" r="1.9" fill="#3b2a26"/>
      <circle cx="5" cy="0" r="1.9" fill="#3b2a26"/>
      <path d="M-2.4 2.6 Q0 4.8 2.4 2.6" stroke="#3b2a26" stroke-width="1.3" fill="none" stroke-linecap="round"/>
      <ellipse cx="-9" cy="3" rx="2.6" ry="1.5" fill="#ff7b93" opacity=".55"/>
      <ellipse cx="9" cy="3" rx="2.6" ry="1.5" fill="#ff7b93" opacity=".55"/>
    </g>
    <g id="flower">
      <g fill="#ffb3c4">
        <circle cx="0" cy="-4" r="3.2"/><circle cx="3.8" cy="-1.2" r="3.2"/><circle cx="2.4" cy="3.3" r="3.2"/>
        <circle cx="-2.4" cy="3.3" r="3.2"/><circle cx="-3.8" cy="-1.2" r="3.2"/>
      </g>
      <circle r="1.8" fill="#fff3a6"/>
    </g>
    <!-- นิกิริแซลมอน -->
    <g id="salmon">
      <rect x="-22" y="-2" width="44" height="20" rx="10" fill="#fffdf7" stroke="#eadfcd" stroke-width="1.5"/>
      <path d="M-25 2 C-25 -12 -14 -15 0 -15 C14 -15 25 -12 25 2 C14 5 -14 5 -25 2 Z" fill="#ff8c69"/>
      <path d="M-14 -11 L-10 1 M-3 -13 L1 2 M8 -12 L11 1 M17 -9 L19 0" stroke="#ffd0bd" stroke-width="2.4" stroke-linecap="round"/>
      <use href="#face" y="10"/>
    </g>
    <!-- นิกิริไข่หวาน -->
    <g id="tamago">
      <rect x="-22" y="-2" width="44" height="20" rx="10" fill="#fffdf7" stroke="#eadfcd" stroke-width="1.5"/>
      <rect x="-24" y="-15" width="48" height="16" rx="6" fill="#ffd45c"/>
      <rect x="-4" y="-16" width="8" height="34" rx="2" fill="#2f3d46"/>
      <g transform="translate(0 9)"><rect x="-17" y="-4" width="34" height="10" rx="4" fill="#fffdf7"/><use href="#face"/></g>
    </g>
    <!-- มากิ -->
    <g id="maki">
      <circle r="20" fill="#2f3d46"/>
      <circle r="15.5" fill="#fffdf7"/>
      <circle cx="-3" cy="-3" r="5" fill="#ff8c69"/>
      <circle cx="4" cy="-1" r="3.6" fill="#8fd48a"/>
      <circle cx="0" cy="4" r="3.4" fill="#ffd45c"/>
    </g>
    <!-- ข้าวปั้นสามเหลี่ยม -->
    <g id="onigiri">
      <path d="M0 -21 C6 -21 23 6 23 12 C23 19 17 20 0 20 C-17 20 -23 19 -23 12 C-23 6 -6 -21 0 -21 Z" fill="#fffdf7" stroke="#eadfcd" stroke-width="1.5"/>
      <rect x="-10" y="6" width="20" height="14" rx="2.5" fill="#2f3d46"/>
      <use href="#face" y="-1"/>
    </g>
  </defs>

  <rect width="240" height="240" fill="#ffefe6"/>
  <!-- จุดเล็กๆ -->
  <g fill="#ffd6c8">
    <circle cx="120" cy="20" r="3"/><circle cx="20" cy="120" r="3"/><circle cx="120" cy="220" r="3"/><circle cx="220" cy="120" r="3"/>
    <circle cx="180" cy="80" r="2.4"/><circle cx="60" cy="200" r="2.4"/><circle cx="200" cy="200" r="2"/><circle cx="40" cy="40" r="2"/>
  </g>

  <use href="#salmon" x="60" y="60" transform="rotate(-8 60 60)"/>
  <use href="#maki" x="180" y="55"/>
  <use href="#onigiri" x="60" y="175" transform="rotate(6 60 175)"/>
  <use href="#tamago" x="182" y="178" transform="rotate(-6 182 178)"/>
  <use href="#flower" x="120" y="120"/>
  <use href="#flower" x="0" y="0"/><use href="#flower" x="240" y="0"/><use href="#flower" x="0" y="240"/><use href="#flower" x="240" y="240"/>
</svg>
