<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>โต๊ะวันนี้</title>
  <meta name="description" content="ดูว่าเพื่อนนั่งโต๊ะไหนในโรงอาหาร">
  <meta property="og:title" content="โต๊ะวันนี้ 📍">
  <meta property="og:description" content="ดูว่าเพื่อนนั่งโต๊ะไหนในโรงอาหาร เดินตามลูกศรสีฟ้าไปได้เลย">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://torim-beta.vercel.app/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#4b2fd6">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- ให้ iPhone/Android รุ่นเก่าที่ยังไม่รู้จัก importmap เปิดได้ -->
  <script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>

  <header class="card top">
    <div class="title-row">
      <div class="title"><span class="avatar mini" data-char="cat"></span>โต๊ะวันนี้</div>
      <button id="adm-exit" class="ghost small" hidden>ออกจากแอดมิน</button>
    </div>
    <div class="hint" id="hint"></div>
  </header>

  <!-- ปุ่มลอยกลับไปที่โต๊ะ (แบบปุ่มตำแหน่งใน Apple Maps) อยู่เหนือแถบด้านล่าง -->
  <button id="recenter" class="fab" hidden aria-label="กลับไปที่โต๊ะ">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M20.2 3.8 3.9 10.6c-.8.3-.7 1.5.1 1.7l6.6 1.6 1.6 6.6c.2.8 1.4.9 1.7.1L20.7 4.3c.2-.4-.1-.7-.5-.5Z" fill="currentColor"/></svg>
  </button>

  <!-- แถบด้านล่างแบบแอปมือถือ: แสดงตลอด มี 2 แท็บ -->
  <nav id="dock" class="dock" aria-label="เมนูหลัก">
    <div class="dock-body">
      <!-- แท็บ 1: โต๊ะ -->
      <section id="tab-table" class="pane" role="tabpanel" aria-labelledby="tabbtn-table">
        <!-- ยังไม่ได้เลือกโต๊ะ: น้องข้าวช่วยแนะนำ (แตะเพื่อดูคำแนะนำถัดไป) -->
        <div id="table-empty" class="mascot">
          <button id="mascot-btn" class="mascot-art" data-char="cat" aria-label="แตะเพื่อดูคำแนะนำถัดไป"></button>
          <div class="mascot-bubble" id="mascot-bubble" aria-live="polite"><b class="mascot-name" id="mascot-name"></b><span id="mascot-text"></span></div>
        </div>

        <!-- ฝั่งเรา: เลือกโต๊ะแล้วจอง/แชร์ -->
        <div id="sheet" class="pane-stack" hidden>
          <div class="table-head">
            <div class="table-no">โต๊ะ <span id="sel-id"></span></div>
          </div>
          <div class="label one-line" id="sel-sub"></div>
          <div class="actions" id="sheet-confirm" hidden>
            <button id="pick-cancel" class="ghost">ยกเลิก</button>
            <button id="pick-ok" class="primary">✓ จองโต๊ะนี้</button>
          </div>
          <div class="stack" id="sheet-share">
            <!-- รูปโต๊ะ: ถ่ายของบนโต๊ะ/กระเป๋าไว้ให้เพื่อนสังเกตง่าย -->
            <div class="photo-wrap">
            <button id="photo-row" class="photo-row">
              <span class="photo-thumb" id="photo-thumb">📷</span>
              <span class="photo-text">
                <b id="photo-title">ถ่ายรูปโต๊ะ</b>
                <span id="photo-sub">ให้เพื่อนเห็นว่าโต๊ะเราหน้าตาแบบไหน</span>
              </span>
              <span class="photo-go" aria-hidden="true">›</span>
            </button>
            <button id="photo-album" class="ghost square" aria-label="เลือกรูปจากอัลบั้ม" title="เลือกรูปจากอัลบั้ม">🖼️</button>
            </div>
            <div class="share-bar">
              <button id="share" class="primary">แชร์ให้เพื่อน</button>
              <button id="preview" class="ghost square" aria-label="ดูแบบที่เพื่อนเห็น" title="ดูแบบที่เพื่อนเห็น">👀</button>
              <button id="clear" class="ghost square danger" aria-label="ยกเลิกการจอง" title="ยกเลิกการจอง">
                <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 3h6l1 2h4v2H4V5h4l1-2Zm-3 6h12l-1 11a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L6 9Zm4 2v8h1.6v-8H10Zm3.4 0v8H15v-8h-1.6Z" fill="currentColor"/></svg>
              </button>
            </div>
          </div>
          <!-- ซ่อนแบบมองไม่เห็นแทน hidden: บางเบราว์เซอร์ (เช่น ใน LINE) ไม่ยอมเปิดกล้องจากช่องที่ display:none -->
          <input id="photo-input" class="vh" type="file" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
          <input id="photo-pick" class="vh" type="file" accept="image/*" tabindex="-1" aria-hidden="true">
        </div>

        <!-- ฝั่งเพื่อน: เปิดจากลิงก์ -->
        <div id="banner" class="pane-stack" hidden>
          <div class="with-avatar">
            <span class="avatar" data-char="dog"></span>
            <div>
            <div class="label" id="ban-who"></div>
            <div class="big">โต๊ะ <span id="ban-id"></span></div>
            <div class="label" id="ban-sub"></div>
            </div>
          </div>
          <div class="warn" id="ban-warn" hidden></div>
          <div class="actions">
            <button id="focus" class="primary">ไปที่โต๊ะ</button>
            <button id="own" class="ghost">เลือกโต๊ะเอง</button>
          </div>
        </div>
      </section>

      <!-- แท็บ 2: วันนี้กินอะไรดี -->
      <section id="tab-food" class="pane" role="tabpanel" aria-labelledby="tabbtn-food" hidden>
        <div class="pane-stack">
          <div id="food-head" class="with-avatar">
            <span class="avatar" data-char="bear"></span>
            <div>
              <div class="big food-title">วันนี้กินอะไรดี</div>
              <div class="label" id="food-sub"></div>
            </div>
          </div>
          <div id="food-main" class="stack">
            <div class="slot" id="food-slot" aria-live="polite">🍛</div>
          </div>
          <div id="food-edit" class="stack" hidden>
            <div class="chips" id="food-chips"></div>
            <div class="share-row">
              <input id="food-new" placeholder="เพิ่มเมนู เช่น ข้าวขาหมู" maxlength="30" aria-label="เพิ่มเมนู" enterkeyhint="done">
              <button id="food-add" class="ghost">เพิ่ม</button>
            </div>
          </div>
          <div class="actions food-actions">
            <button id="food-reset" class="ghost" hidden>คืนค่าเริ่มต้น</button>
            <button id="food-edit-toggle" class="ghost">✏️ แก้เมนู</button>
            <button id="food-spin" class="primary">🎲 สุ่มเลย</button>
          </div>
        </div>
      </section>
    </div>

    <div class="tabbar" role="tablist">
      <button id="tabbtn-table" class="tab on" role="tab" aria-selected="true" aria-controls="tab-table" data-tab="table">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c-4 0-7 3-7 7 0 5.2 6.1 11.3 6.4 11.6.3.3.9.3 1.2 0 .3-.3 6.4-6.4 6.4-11.6 0-4-3-7-7-7Zm0 9.8a2.8 2.8 0 1 1 0-5.6 2.8 2.8 0 0 1 0 5.6Z" fill="currentColor"/></svg>
        <span>โต๊ะ</span><i class="badge" id="badge-table" hidden></i>
      </button>
      <button id="tabbtn-food" class="tab" role="tab" aria-selected="false" aria-controls="tab-food" data-tab="food">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8.5" cy="8.5" r="1.6" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.6" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.6" fill="currentColor"/></svg>
        <span>กินอะไรดี</span><i class="badge" id="badge-food" hidden></i>
      </button>
    </div>
  </nav>

  <!-- แอดมิน: เปิดด้วย ?admin -->
  <section id="admin" class="card bottom" hidden>
    <div class="label" id="adm-pick">แตะโต๊ะเพื่อเปลี่ยนแบบ หรือแตะช่องว่างเพื่อเพิ่มโต๊ะ</div>
    <div id="adm-cell" class="stack" hidden>
      <div class="row">
        <div>
          <div class="big" id="adm-title"></div>
          <div class="label" id="adm-sub"></div>
        </div>
        <button id="adm-close" class="icon" aria-label="ปิด">✕</button>
      </div>
      <!-- แก้ทีละโต๊ะ หรือทั้งแถวในครั้งเดียว -->
      <div class="seg3" id="adm-scope">
        <button class="ghost" data-scope="one">โต๊ะนี้</button>
        <button class="ghost" data-scope="col"></button>
        <button class="ghost" data-scope="row"></button>
      </div>
      <div class="seg" id="adm-types"></div>
      <div class="actions" id="adm-table-actions">
        <button id="adm-rotate" class="ghost">หมุน 90°</button>
        <button id="adm-delete" class="ghost danger">ลบโต๊ะ</button>
      </div>
      <button id="adm-fill" class="ghost" hidden></button>
    </div>
    <hr>
    <div class="label" id="adm-status"></div>
    <div class="share-row" id="adm-auth" hidden>
      <input id="adm-pass" type="password" placeholder="รหัสแอดมิน" autocomplete="current-password" aria-label="รหัสแอดมิน">
      <button id="adm-send" class="primary">บันทึก</button>
    </div>
    <div class="actions" id="adm-confirm" hidden>
      <button id="adm-cancel" class="ghost">ยกเลิก</button>
      <button id="adm-ok" class="primary">✓ ตกลง</button>
    </div>
    <div class="stack" id="adm-publish">
      <button id="adm-push" class="primary" hidden>บันทึกขึ้นเว็บ</button>
      <div class="actions">
        <button id="adm-download" class="ghost">ดาวน์โหลดไฟล์</button>
        <button id="adm-reset" class="ghost">ทิ้งที่แก้</button>
      </div>
    </div>
  </section>

  <!-- ดูรูปโต๊ะเต็มจอ -->
  <section id="photo-view" class="photo-view" hidden role="dialog" aria-label="รูปโต๊ะ">
    <div class="photo-view-top">
      <div>
        <div class="photo-view-title" id="photo-view-title"></div>
        <div class="photo-view-sub" id="photo-view-sub"></div>
      </div>
      <button id="photo-close" class="icon dark" aria-label="ปิด">✕</button>
    </div>
    <img id="photo-img" alt="รูปโต๊ะ">
    <div class="photo-view-actions">
      <button id="photo-delete" class="ghost dark">ลบรูป</button>
      <button id="photo-repick" class="ghost dark">🖼️ อัลบั้ม</button>
      <button id="photo-retake" class="primary">📷 ถ่ายใหม่</button>
    </div>
  </section>

  <div id="toast" class="toast" hidden></div>

  <!-- ถ้าเปิดแผนที่ไม่สำเร็จ ขึ้นคำแนะนำแทนหน้าขาวๆ -->
  <section id="boot-error" class="boot-error" hidden>
    <div class="big">เปิดแผนที่ไม่ได้ 😢</div>
    <div class="label">เบราว์เซอร์นี้อาจเปิดแผนที่ 3D ไม่ได้ ลองวิธีนี้:</div>
    <ol class="label">
      <li>ถ้าเปิดจาก LINE ให้กด <b>⋯</b> มุมขวาบน แล้วเลือก <b>เปิดในเบราว์เซอร์</b> (Safari / Chrome)</li>
      <li>อัปเดต iOS หรือแอป Chrome ให้เป็นรุ่นล่าสุด</li>
    </ol>
    <button id="boot-retry" class="primary">ลองใหม่</button>
    <div class="label boot-why" id="boot-why"></div>
  </section>
  <script>
    (function () {
      function show(why) {
        if (window.torimReady) return;
        document.getElementById('boot-error').hidden = false;
        if (why) document.getElementById('boot-why').textContent = 'รายละเอียด: ' + why;
      }
      document.getElementById('boot-retry').onclick = function () { location.reload(); };
      window.addEventListener('error', function (e) { show(e.message); });
      window.addEventListener('unhandledrejection', function (e) { show(String((e.reason && e.reason.message) || e.reason)); });
      setTimeout(function () { show('โหลดนานเกินไป เน็ตอาจช้า'); }, 15000);
    })();
  </script>

  <script type="module" src="main.js"></script>
</body>
</html>
