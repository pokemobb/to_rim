<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>โต๊ะวันนี้</title>
  <meta name="description" content="ดูว่าเพื่อนนั่งโต๊ะไหนในโรงอาหาร">
  <meta property="og:title" content="โต๊ะวันนี้ 📍">
  <meta property="og:description" content="ดูว่าเพื่อนนั่งโต๊ะไหนในโรงอาหาร เดินตามลูกศรสีฟ้าไปได้เลย">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://torim-beta.vercel.app/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#dde1e8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📍</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- ให้ iPhone/Android รุ่นเก่าที่ยังไม่รู้จัก importmap เปิดได้ -->
  <script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>

  <header class="card top">
    <div class="title-row">
      <div class="title">📍 โต๊ะวันนี้</div>
      <button id="adm-exit" class="ghost small" hidden>ออกจากแอดมิน</button>
    </div>
    <div class="hint" id="hint"></div>
  </header>

  <!-- ฝั่งเรา: เลือกโต๊ะแล้วแชร์ -->
  <section id="sheet" class="card bottom" hidden>
    <div class="row">
      <div>
        <div class="big">โต๊ะ <span id="sel-id"></span></div>
        <div class="label" id="sel-sub"></div>
      </div>
      <button id="sheet-close" class="icon" aria-label="ย่อ">✕</button>
    </div>
    <!-- แตะโต๊ะใหม่: ยืนยันก่อน ค่อยแชร์ -->
    <div class="actions" id="sheet-confirm" hidden>
      <button id="pick-cancel" class="ghost">ยกเลิก</button>
      <button id="pick-ok" class="primary">✓ จองโต๊ะนี้</button>
    </div>
    <div class="stack" id="sheet-share">
      <button id="share" class="primary">แชร์ให้เพื่อน</button>
      <button id="preview" class="ghost">👀 ดูแบบที่เพื่อนเห็น</button>
      <button id="clear" class="link">ยกเลิกการจอง</button>
    </div>
  </section>

  <!-- ฝั่งเพื่อน: เปิดจากลิงก์ -->
  <section id="banner" class="card bottom" hidden>
    <div class="row">
      <div>
        <div class="label" id="ban-who"></div>
        <div class="big">โต๊ะ <span id="ban-id"></span></div>
        <div class="label" id="ban-sub"></div>
      </div>
      <button id="banner-close" class="icon" aria-label="ย่อ">✕</button>
    </div>
    <div class="warn" id="ban-warn" hidden></div>
    <div class="actions">
      <button id="focus" class="primary">ไปที่โต๊ะ</button>
      <button id="own" class="ghost">เลือกโต๊ะเอง</button>
    </div>
  </section>

  <!-- การ์ดที่ย่อแล้ว เหลือป้ายเล็กๆ แตะเพื่อเปิดอีกครั้ง -->
  <!-- ปุ่มลอยกลับไปที่โต๊ะ (แบบปุ่มตำแหน่งใน Apple Maps) -->
  <button id="recenter" class="fab" hidden aria-label="กลับไปที่โต๊ะ">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M20.2 3.8 3.9 10.6c-.8.3-.7 1.5.1 1.7l6.6 1.6 1.6 6.6c.2.8 1.4.9 1.7.1L20.7 4.3c.2-.4-.1-.7-.5-.5Z" fill="currentColor"/></svg>
  </button>
  <button id="pill" class="pill" hidden><span class="dot"></span><span id="pill-text"></span></button>

  <!-- มาสคอต "น้องข้าว" ชามข้าวไข่ดาว คอยให้คำแนะนำใต้แผนที่ (แตะเพื่อดูคำแนะนำถัดไป) -->
  <div id="mascot" class="mascot" hidden>
    <button id="mascot-btn" class="mascot-art" aria-label="น้องข้าว แตะเพื่อดูคำแนะนำถัดไป">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <ellipse cx="60" cy="113" rx="30" ry="4.5" fill="rgba(0,0,0,.13)"/>
        <g class="wave">
          <path d="M101 72 q9 -9 7 -21" stroke="#ff7a59" stroke-width="7" stroke-linecap="round" fill="none"/>
          <circle cx="108" cy="49" r="6.5" fill="#ff9677"/>
        </g>
        <path d="M24 62 C24 36 40 22 60 22 C80 22 96 36 96 62 Z" fill="#fffdf8" stroke="#ebe4d6" stroke-width="2"/>
        <g fill="#efe7d7">
          <ellipse cx="40" cy="48" rx="3.2" ry="1.6" transform="rotate(-30 40 48)"/>
          <ellipse cx="52" cy="40" rx="3.2" ry="1.6" transform="rotate(20 52 40)"/>
          <ellipse cx="80" cy="47" rx="3.2" ry="1.6" transform="rotate(35 80 47)"/>
          <ellipse cx="62" cy="52" rx="3.2" ry="1.6" transform="rotate(-10 62 52)"/>
          <ellipse cx="46" cy="56" rx="3.2" ry="1.6" transform="rotate(15 46 56)"/>
        </g>
        <path d="M50 31 C50 22 58 20 66 21 C76 21 84 25 82 32 C80 38 70 37 64 38 C56 39 50 37 50 31 Z" fill="#fff" stroke="#efe6d4" stroke-width="1.5"/>
        <circle cx="66" cy="29.5" r="6" fill="#ffc531"/>
        <circle cx="64" cy="27.5" r="1.8" fill="#ffe27a"/>
        <path d="M14 60 H106 C106 90 86 108 60 108 C34 108 14 90 14 60 Z" fill="#ff7a59"/>
        <path d="M14 60 H106 C106 63.5 105.7 66.5 105.2 69.5 H14.8 C14.3 66.5 14 63.5 14 60 Z" fill="#ff9b7f"/>
        <path d="M27 99 H93" stroke="#ffc9b8" stroke-width="3" stroke-dasharray="5 7" stroke-linecap="round"/>
        <g class="eyes">
          <ellipse cx="47" cy="80" rx="4.6" ry="5.6" fill="#2b2320"/>
          <ellipse cx="73" cy="80" rx="4.6" ry="5.6" fill="#2b2320"/>
          <circle cx="48.7" cy="78" r="1.7" fill="#fff"/>
          <circle cx="74.7" cy="78" r="1.7" fill="#fff"/>
        </g>
        <ellipse cx="37" cy="89" rx="6" ry="3.4" fill="#ff3d63" opacity=".4"/>
        <ellipse cx="83" cy="89" rx="6" ry="3.4" fill="#ff3d63" opacity=".4"/>
        <path d="M55 87 Q60 93 65 87" stroke="#2b2320" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        <circle cx="15" cy="76" r="6.5" fill="#ff9677"/>
      </svg>
    </button>
    <div class="mascot-bubble" id="mascot-text" aria-live="polite"></div>
  </div>

  <!-- 🎲 วันนี้กินอะไรดี -->
  <button id="food-btn" class="fab fab-left" hidden aria-label="วันนี้กินอะไรดี">🎲</button>
  <section id="food" class="card bottom" hidden>
    <div class="row">
      <div>
        <div class="big food-title">วันนี้กินอะไรดี</div>
        <div class="label" id="food-sub"></div>
      </div>
      <button id="food-close" class="icon" aria-label="ปิด">✕</button>
    </div>
    <div class="slot" id="food-slot" aria-live="polite">🍛</div>
    <button id="food-spin" class="primary">🎲 สุ่มเลย</button>
    <button id="food-edit-toggle" class="link plain">แก้รายการเมนู</button>
    <div id="food-edit" class="stack" hidden>
      <div class="chips" id="food-chips"></div>
      <div class="share-row">
        <input id="food-new" placeholder="เพิ่มเมนู เช่น ข้าวขาหมู" maxlength="30" aria-label="เพิ่มเมนู" enterkeyhint="done">
        <button id="food-add" class="ghost">เพิ่ม</button>
      </div>
      <button id="food-reset" class="link plain">คืนรายการเริ่มต้น</button>
    </div>
  </section>

  <!-- แอดมิน: เปิดด้วย ?admin -->
  <section id="admin" class="card bottom" hidden>
    <div class="label" id="adm-pick">แตะโต๊ะเพื่อเปลี่ยนแบบ หรือแตะช่องว่างเพื่อเพิ่มโต๊ะ</div>
    <div id="adm-cell" class="stack" hidden>
      <div class="row">
        <div>
          <div class="big" id="adm-title"></div>
          <div class="label" id="adm-sub"></div>
        </div>
        <button id="adm-close" class="icon" aria-label="ปิด">✕</button>
      </div>
      <!-- แก้ทีละโต๊ะ หรือทั้งแถวในครั้งเดียว -->
      <div class="seg3" id="adm-scope">
        <button class="ghost" data-scope="one">โต๊ะนี้</button>
        <button class="ghost" data-scope="col"></button>
        <button class="ghost" data-scope="row"></button>
      </div>
      <div class="seg" id="adm-types"></div>
      <div class="actions" id="adm-table-actions">
        <button id="adm-rotate" class="ghost">หมุน 90°</button>
        <button id="adm-delete" class="ghost danger">ลบโต๊ะ</button>
      </div>
      <button id="adm-fill" class="ghost" hidden></button>
    </div>
    <hr>
    <div class="label" id="adm-status"></div>
    <div class="share-row" id="adm-auth" hidden>
      <input id="adm-pass" type="password" placeholder="รหัสแอดมิน" autocomplete="current-password" aria-label="รหัสแอดมิน">
      <button id="adm-send" class="primary">บันทึก</button>
    </div>
    <div class="actions" id="adm-confirm" hidden>
      <button id="adm-cancel" class="ghost">ยกเลิก</button>
      <button id="adm-ok" class="primary">✓ ตกลง</button>
    </div>
    <div class="stack" id="adm-publish">
      <button id="adm-push" class="primary" hidden>บันทึกขึ้นเว็บ</button>
      <div class="actions">
        <button id="adm-download" class="ghost">ดาวน์โหลดไฟล์</button>
        <button id="adm-reset" class="ghost">ทิ้งที่แก้</button>
      </div>
    </div>
  </section>

  <div id="toast" class="toast" hidden></div>

  <!-- ถ้าเปิดแผนที่ไม่สำเร็จ ขึ้นคำแนะนำแทนหน้าขาวๆ -->
  <section id="boot-error" class="boot-error" hidden>
    <div class="big">เปิดแผนที่ไม่ได้ 😢</div>
    <div class="label">เบราว์เซอร์นี้อาจเปิดแผนที่ 3D ไม่ได้ ลองวิธีนี้:</div>
    <ol class="label">
      <li>ถ้าเปิดจาก LINE ให้กด <b>⋯</b> มุมขวาบน แล้วเลือก <b>เปิดในเบราว์เซอร์</b> (Safari / Chrome)</li>
      <li>อัปเดต iOS หรือแอป Chrome ให้เป็นรุ่นล่าสุด</li>
    </ol>
    <button id="boot-retry" class="primary">ลองใหม่</button>
    <div class="label boot-why" id="boot-why"></div>
  </section>
  <script>
    (function () {
      function show(why) {
        if (window.torimReady) return;
        document.getElementById('boot-error').hidden = false;
        if (why) document.getElementById('boot-why').textContent = 'รายละเอียด: ' + why;
      }
      document.getElementById('boot-retry').onclick = function () { location.reload(); };
      window.addEventListener('error', function (e) { show(e.message); });
      window.addEventListener('unhandledrejection', function (e) { show(String((e.reason && e.reason.message) || e.reason)); });
      setTimeout(function () { show('โหลดนานเกินไป เน็ตอาจช้า'); }, 15000);
    })();
  </script>

  <script type="module" src="main.js"></script>
</body>
</html>
